services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.7.0
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - "localhost:*,127.0.0.1:*,0.0.0.0:*"
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow

volumes:
  mlflow-data:
